{{- if .Values.dockerregistry.enabled }}
{{- $auth := printf "%s:%s" .Values.dockerregistry.username .Values.dockerregistry.password | b64enc }}
{{- $registry := dict "username" .Values.dockerregistry.username "password" .Values.dockerregistry.password "email" .Values.dockerregistry.email "auth" $auth }}
{{- $config := dict "auths" (dict .Values.dockerregistry.server $registry) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-dockerregistry
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ toJson $config | b64enc | quote }}
{{- end }}
