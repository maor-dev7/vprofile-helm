app:
  image: 727646491723.dkr.ecr.us-east-1.amazonaws.com/vprofile-appimg
  tag: 9ef5d0fabd38daa95e3407b65c1118a05efe080c
  replicas: 1
  containerPort: 8080
  servicePort: 8080
db:
  image: vprocontainers/vprofiledb
  tag: latest
  replicas: 1
  containerPort: 3306
  servicePort: 3306
  storageClass: gp2
  storageSize: 3Gi
memcached:
  image: memcached
  tag: latest
  replicas: 1
  containerPort: 11211
  servicePort: 11211
rabbitmq:
  image: rabbitmq
  tag: latest
  replicas: 1
  containerPort: 5672
  servicePort: 5672
  defaultUser: guest
initcontainers:
  image: busybox
  tag: latest
  dbCommand:
    - sh
    - -c
    - until nslookup vprodb.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for mydb; sleep 2; done;
  memcachedCommand:
    - sh
    - -c
    - until nslookup vprocache01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for memcached; sleep 2; done;
  cleanupCommand:
    - sh
    - -c
    - rm -rf /var/lib/mysql/lost+found
ingress:
  enabled: true
  host: vprofile.mrelitelab.xyz
  servicePort: 8080
secrets:
  enabled: true
  dbPass: vprodbpass
  rmqPass: guest
dockerregistry:
  enabled: false
  server: https://index.docker.io/v1/
  username: ""
  password: ""
  email: ""
